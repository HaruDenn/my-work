<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stress Level Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
    }
    button {
      padding: 10px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Stress Level Prediction</h2>
  <form id="stressForm">
    <label>Study Hours Per Day</label>
    <input type="number" id="study" step="0.1" required />

    <label>Extracurricular Hours Per Day</label>
    <input type="number" id="extra" step="0.1" required />

    <label>Sleep Hours Per Day</label>
    <input type="number" id="sleep" step="0.1" required />

    <label>Social Hours Per Day</label>
    <input type="number" id="social" step="0.1" required />

    <label>Physical Activity Hours Per Day</label>
    <input type="number" id="physical" step="0.1" required />

    <label>GPA</label>
    <input type="number" id="gpa" step="0.01" required />

    <button type="submit">Predict Stress Level</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById("stressForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const payload = {
        Study_Hours_Per_Day: parseFloat(document.getElementById("study").value),
        Extracurricular_Hours_Per_Day: parseFloat(document.getElementById("extra").value),
        Sleep_Hours_Per_Day: parseFloat(document.getElementById("sleep").value),
        Social_Hours_Per_Day: parseFloat(document.getElementById("social").value),
        Physical_Activity_Hours_Per_Day: parseFloat(document.getElementById("physical").value),
        GPA: parseFloat(document.getElementById("gpa").value)
      };

      // Ganti URL di bawah dengan endpoint model kamu
      const API_URL = "http://localhost:5000/predict";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        document.getElementById("result").innerText = "Predicted Stress Level: " + data.stress_level;
      } catch (err) {
        document.getElementById("result").innerText = "Error connecting to model API.";
      }
    });
  </script>
</body>
</html>
